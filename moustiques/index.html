<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b7f4b"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-512.png"><link rel="apple-touch-icon" href="icon-512.png"><title>Anti-Chik</title><style>:root{--b:#f2f7f4;--c:#fff;--t:#14281d;--l:#eee}@media(prefers-color-scheme:dark){:root{--b:#101a14;--c:#1a2a20;--t:#e6f2ea;--l:#2a3d31}}*{box-sizing:border-box;margin:0;padding:0}body{font:16px/1.45 system-ui,sans-serif;background:var(--b);color:var(--t);padding-bottom:30px}header{background:#1b7f4b;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font-weight:700;font-size:1.15rem}header img{height:28px;vertical-align:middle;border-radius:6px}main{padding:16px;max-width:620px;margin:0 auto}.c{background:var(--c);border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 2px 8px #0002}h2{font-size:1.05rem;color:#2fa866;margin-bottom:8px}label{display:block;padding:9px 0;border-bottom:1px solid var(--l)}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:8px}button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;background:#1b7f4b;color:#fff;font-size:1rem;font-weight:600}button.s{background:0;color:#2fa866;border:2px solid #2fa866}.row{display:flex;gap:8px}.row button{flex:1}#out{white-space:pre-wrap;margin-top:10px;font-size:.93rem}#photo{display:none}.p{margin-top:8px;font-weight:600}li{margin:6px 0 0 18px;font-size:.93rem}summary{font-weight:700;color:#2fa866}</style></head><body><header><img src="icon-512.png" alt=""> Anti-Chik<br><small style="font-weight:400">Anti-moustiques</small><br><small style="font-weight:400">Piton Sainte-Rose</small></header><main><div class="c"><h2>🧹 Chaque jour : eaux stagnantes</h2><div id="list"></div><p class="p" id="pg"></p><div class="row"><button class="s" id="all">Tout cocher</button><button class="s" id="shr">Partager</button></div></div><div class="c"><h2>📅 Chaque semaine</h2><div id="wl"></div><p class="p" id="wp"></p></div><div class="c"><h2>🧴 Repulsif</h2><p id="rep"></p><div class="row"><button id="app">Je viens d'en appliquer</button><button class="s" id="clr">Effacer</button></div></div><div class="c"><h2>📷 Analyser un recoin</h2><p>Photographie : l'IA repere les eaux stagnantes.</p><button id="shot">Prendre une photo</button><input type="file" id="photo" accept="image/*" capture="environment"><div id="out"></div></div></main><script>
const $=i=>document.getElementById(i),D=new Date(),day=D.toLocaleDateString('sv'),wk=Math.floor(Date.now()/6048e5);
const L=['Vider les soucoupes','Vider seaux/arrosoirs','Couvrir citernes','Retourner pots/jouets','Eau des vases','Verifier pneus/bidons','Curer gouttires'];
const W=['Gouttires et regards','Soucoupes collees','Futs et citernes','Toits/baaches/abris','Plantes en eau'];
let s=Object.assign({c:[],wc:[],h:[]},JSON.parse(localStorage.getItem('mq')||'{}'));
if(s.d!==day){s.d=day;s.c=[]}if(s.w!==wk){s.w=wk;s.wc=[]}
const save=()=>localStorage.setItem('mq',JSON.stringify(s));
const box=(el,A,k)=>$(el).innerHTML=A.map((t,i)=>'<label><input type=checkbox data-k='+k+' data-i='+i+(s[k].includes(i)?' checked':'')+'>'+t+'</label>').join('');
function draw(){box('list',L,'c');box('wl',W,'wc');if(s.c.length==L.length&&!s.h.includes(day))s.h.push(day);let n=0,t=new Date(day);if(!s.h.includes(day))t.setUTCDate(t.getUTCDate()-1);while(s.h.includes(t.toISOString().slice(0,10))){n++;t.setUTCDate(t.getUTCDate()-1)}save();$('pg').textContent=s.c.length+'/'+L.length+' auj  |  🔥 '+n+' j suites';$('wp').textContent=s.wc.length+'/'+W.length+' sem';rep()}
function rep(){const m=s.r?Math.round((s.r-Date.now())/6e4):0;$('rep').textContent=!s.r?'Non applique':m<=0?'A reappliquer maintenant':'Encore '+Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' protection'}
setInterval(rep,6e4);
document.addEventListener('change',e=>{const d=e.target.dataset;if(!d.k)return;const i=+d.i;s[d.k]=e.target.checked?[...s[d.k],i]:s[d.k].filter(x=>x!==i);draw()});
$('all').onclick=()=>{s.c=L.map((_,i)=>i);draw()};
$('shr').onclick=()=>{const t='Anti-Chik : '+s.c.length+'/'+L.length+' gestes faits!';navigator.share?navigator.share({text:t}).catch(()=>{}):navigator.clipboard.writeText(t)};
$('app').onclick=()=>{const h=+prompt('Reappliquer dans X heures ?',4)||4;s.r=Date.now()+h*36e5;draw()};
$('clr').onclick=()=>{s.r=0;draw()};
$('shot').onclick=()=>$('photo').click();
$('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1100/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ask(c.toDataURL('image/jpeg',.82).split(',')[1])};im.src=URL.createObjectURL(f)};
async function ask(b64){const cfg=JSON.parse(localStorage.getItem('zf')||'{}');if(!cfg.k){const k=prompt('Cle API Gemini ?');if(!k)return;cfg.k=k.trim();localStorage.setItem('zf',JSON.stringify(cfg))}$('out').textContent='Analyse...';try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+(cfg.m||'gemini-flash-latest')+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.k},body:JSON.stringify({contents:[{role:'user',parts:[{text:'Repere sur cette photo les gites larvaires (eau, recipients, baaches). Reponds court en francais.'},{inline_data:{mime_type:'image/jpeg',data:b64}}]}]})});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);$('out').textContent=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('')}catch(e){$('out').textContent='Erreur: '+e.message}}
draw();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
