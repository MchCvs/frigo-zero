<main>
<div class="card">
<h2>🧹 Chaque jour</h2>
<div id="list"></div>
<p id="stat" style="margin-top: 10px; font-weight: bold;"></p>
</div>

<div class="card">
<h2>🧴 Répulsif</h2>
<p id="rep"></p>
<button onclick="appliquer()">Je viens d'appliquer</button>
</div>

<div class="card">
<h2>📷 Analyser un recoin</h2>
<button onclick="document.getElementById('photo').click()">Prendre une photo</button>
<input type="file" id="photo" accept="image/*" capture="environment">
<div id="out"></div>
</div>
</main>

<dialog id="dlg">
<h3>⚙️ Paramètres</h3>
<label>Clé API Gemini :<input type="password" id="apikey" placeholder="AIza..."></label>
<button onclick="savekey()">Enregistrer</button>
<a href="https://aistudio.google.com/apikey" target="_blank">Obtenir une clé →</a>
</dialog>

<script>
const L = ['Vider soucoupes', 'Seaux/arrosoirs', 'Retourner pots', 'Eau vases', 'Gouttières'];
let s = JSON.parse(localStorage.getItem('mq') || '{"c":[], "r":0}');
let cfg = JSON.parse(localStorage.getItem('zf') || '{}');

function draw() {
  let html = '';
  L.forEach((t, i) => {
    html += '<label><input type="checkbox" ' + (s.c.includes(i) ? 'checked' : '') + ' onchange="toggle(' + i + ')"> ' + t + '</label>';
  });
  document.getElementById('list').innerHTML = html;
  document.getElementById('stat').textContent = s.c.length + '/' + L.length + ' fait';
}

function toggle(i) {
  if (s.c.includes(i)) s.c = s.c.filter(x => x !== i);
  else s.c.push(i);
  localStorage.setItem('mq', JSON.stringify(s));
  draw();
}

function appliquer() {
  const h = prompt('Reappliquer dans combien d\'heures ?', '4');
  if (h) {
    s.r = Date.now() + parseInt(h) * 3600000;
    localStorage.setItem('mq', JSON.stringify(s));
    maj_rep();
  }
}

function maj_rep() {
  if (!s.r) {
    document.getElementById('rep').textContent = 'Non appliqué';
  } else {
    const m = Math.round((s.r - Date.now()) / 60000);
    if (m <= 0) {
      document.getElementById('rep').textContent = '⚠️ À reappliquer maintenant';
    } else {
      document.getElementById('rep').textContent = 'Encore ' + Math.floor(m / 60) + 'h ' + (m % 60) + 'min';
    }
  }
}

function savekey() {
  cfg.k = document.getElementById('apikey').value.trim();
  localStorage.setItem('zf', JSON.stringify(cfg));
  document.getElementById('dlg').close();
  alert('Clé enregistrée');
}

document.getElementById('photo').onchange = function(e) {
  const f = e.target.files[0];
  if (!f) return;
  if (!cfg.k) {
    document.getElementById('out').textContent = '❌ Ajoute une clé API d\'abord (⚙️)';
    return;
  }
  const im = new Image();
  im.onload = () => {
    const c = document.createElement('canvas');
    const k = Math.min(1, 1100 / Math.max(im.width, im.height));
    c.width = im.width * k;
    c.height = im.height * k;
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    analyze(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
  };
  im.src = URL.createObjectURL(f);
};

async function analyze(b64) {
  document.getElementById('out').textContent = '⏳ Analyse...';
  try {
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': cfg.k },
      body: JSON.stringify({
        contents: [{
          role: 'user',
          parts: [
            { text: 'Repère sur cette photo les gîtes larvaires de moustiques (eau stagnante, récipients, bâches, gouttières). Réponds court en français.' },
            { inline_data: { mime_type: 'image/jpeg', data: b64 } }
          ]
        }]
      })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || r.status);
    document.getElementById('out').textContent = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  } catch(e) {
    document.getElementById('out').textContent = '❌ ' + e.message;
  }
}

document.getElementById('apikey').value = cfg.k || '';
draw();
maj_rep();
setInterval(maj_rep, 60000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
